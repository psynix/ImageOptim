<svg xmlns="http://www.w3.org/2000/svg" width="96" height="64" viewBox="0 0 96 64">
  <title>Path morphing requires matching command lists</title>
  <path id="morph" d="M 4 4 L 84 4 L 44 54 Z" fill="#cc2244">
    <animate attributeName="d" values="M 4 4 L 84 4 L 44 54 Z;M 14 14 L 74 14 L 44 44 Z;M 4 4 L 84 4 L 44 54 Z" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
